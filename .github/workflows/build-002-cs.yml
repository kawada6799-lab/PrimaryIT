name: build-002-cs

# 案件002 健診結果作成（kenshin）の配布フォルダ（exe＋DLL 群＋設定＋bat、インストール不要）をビルドして、ダウンロードできる成果物にする。
# main に push されたとき、または Actions タブから手動で実行したとき。
on:
  push:
    branches: [main]
    paths:
      - "cases/002-health-checkup-report-cs/**"
      - ".github/workflows/build-002-cs.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: cases/002-health-checkup-report-cs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Fetch OCR models (PaddleOCR ONNX, from the RapidOCR wheel on PyPI)
        # 写真の読み取りに使う OCR モデル（Apache-2.0）。PyPI の rapidocr の wheel に同梱されている 2 ファイルを取り出すだけ（Python は実行しない）。
        # 配布フォルダの models/ocr に入れる。無ければプログラムは写真の読み取りだけ無効で動く。
        shell: pwsh
        run: |
          pip download rapidocr==3.10.0 --no-deps --no-binary :none: -d ocr-wheel
          $whl = Get-ChildItem ocr-wheel -Filter 'rapidocr-*.whl' | Select-Object -First 1
          if (-not $whl) { throw "rapidocr の wheel が取れません" }
          Expand-Archive -Path $whl.FullName -DestinationPath ocr-wheel/x -Force
          New-Item -ItemType Directory -Force models/ocr | Out-Null
          Copy-Item ocr-wheel/x/rapidocr/models/PP-OCRv6_det_small.onnx, ocr-wheel/x/rapidocr/models/PP-OCRv6_rec_small.onnx models/ocr/
          Get-ChildItem models/ocr | Select-Object Name, Length | Format-Table -AutoSize
      - name: Test
        run: dotnet test tests/Kenshin.Tests/Kenshin.Tests.csproj
      - name: Check no outbound HTTP client
        # 外へ出る通信を持たない方針。HttpClient / WebClient / WebRequest をソースで使っていないことを確認する
        shell: pwsh
        run: |
          $hits = Get-ChildItem -Recurse -Include *.cs src | Where-Object { $_.FullName -notmatch '\\(obj|bin)\\' } | Select-String -Pattern 'HttpClient|WebClient|HttpWebRequest|System\.Net\.Http'
          if ($hits) { $hits | ForEach-Object { Write-Host $_ }; throw "外向きの HTTP クライアントの参照があります" }
      - name: Publish
        # 署名の無い起動用 exe（apphost）は Norton の「ふるまい検知」に止められた。exe を作らず、Microsoft 署名付きの dotnet.exe で kenshin.dll を動かす。
        # .NET ランタイムは dist/runtime に同梱する（インストール不要・フォルダ 1 つは変わらない）。
        run: |
          dotnet publish src/Kenshin/Kenshin.csproj -c Release -r win-x64 --self-contained false -p:UseAppHost=false -o dist
          Copy-Item run.bat, run-dev-noguard.bat, make-shortcut.bat, make-shortcut.ps1, kenshin.ico, README.md dist/
          New-Item -ItemType Directory -Force dist/models/ocr | Out-Null
          Copy-Item models/README.md dist/models/
          Copy-Item models/ocr/*.onnx dist/models/ocr/
          New-Item -ItemType Directory -Force dist/取込 | Out-Null
      - name: Bundle .NET runtime (ASP.NET Core 8, win-x64)
        # Microsoft 公式のインストールスクリプトで、ランタイムを dist/runtime に展開するだけ（レジストリやシステムは触らない）
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://dot.net/v1/dotnet-install.ps1 -OutFile dotnet-install.ps1
          ./dotnet-install.ps1 -Runtime aspnetcore -Channel 8.0 -Architecture x64 -InstallDir dist/runtime -NoPath
          if (-not (Test-Path dist/runtime/dotnet.exe)) { throw "dist/runtime/dotnet.exe がありません" }
          Get-ChildItem dist/runtime/shared | Format-Table Name
          $sig = Get-AuthenticodeSignature dist/runtime/dotnet.exe
          Write-Host "dotnet.exe の署名: $($sig.Status) $($sig.SignerCertificate.Subject)"
      - name: Check dist
        shell: pwsh
        run: |
          Get-ChildItem -Force dist | Select-Object Name, Length | Format-Table -AutoSize
          foreach ($f in @('dist/runtime/dotnet.exe','dist/kenshin.dll','dist/kenshin.runtimeconfig.json','dist/config/config.json','dist/config/判定基準.json','dist/wwwroot/index.html','dist/fonts/ipagp.ttf','dist/models/README.md')) { if (-not (Test-Path $f)) { throw "$f がありません" } }
          if (Test-Path dist/kenshin.exe) { throw "kenshin.exe が残っています（apphost は作らない方針）" }
          if (-not (Get-ChildItem dist -Recurse -Filter 'e_sqlcipher*.dll' | Select-Object -First 1)) { throw "SQLCipher のネイティブ DLL がありません" }
          if (-not (Get-ChildItem dist -Recurse -Filter 'onnxruntime.dll' | Select-Object -First 1)) { throw "ONNX Runtime のネイティブ DLL がありません" }
          foreach ($f in @('dist/models/ocr/PP-OCRv6_det_small.onnx','dist/models/ocr/PP-OCRv6_rec_small.onnx')) { if (-not (Test-Path $f)) { throw "$f がありません" } }
      - uses: actions/upload-artifact@v4
        with:
          name: kenshin-002-windows
          path: cases/002-health-checkup-report-cs/dist
          if-no-files-found: error
