# precheck 設定ファイル。
# このファイルを config.toml にコピーして値を埋める。config.toml は git 管理外。
# パスワード類はここに書かず、環境変数（WAKUMY_PASSWORD, SMTP_PASSWORD）で渡す。

[wakumy]
login_url = "https://hospital.wakumy.lyd.inc/a/admin-app/#/signIn"
id = "xxxx@example.com"            # 医療機関ログインの ID
# password は環境変数 WAKUMY_PASSWORD で渡す
headless = true                     # false にするとブラウザの動きが見える（初回確認用）
timeout_ms = 20000

[rules]
# 「大腸の検査予約」とみなす予約メニューのキーワード（いずれかを含む）
exam_keywords = ["大腸"]
# 上に該当しても除外するキーワード（枠確保用の連鎖予約、事前診察そのもの）
exam_exclude_keywords = ["連鎖用", "事前診察"]
# 「事前診察」とみなす予約メニューのキーワード
pre_exam_keywords = ["大腸カメラ事前診察"]
# 事前診察は検査日の何日前まで遡って有効とみなすか
window_days = 30
# 検査予約として数えるステータス
exam_active_statuses = ["予約"]
# 事前診察として数えるステータス（済んでいる「来院」も含める）
pre_exam_ok_statuses = ["予約", "来院"]
# 予約通知一覧で対象にする通知種別
notification_kind = "予約確定時"
# 通知完了日時がこの日数より古い通知は見ない（初回実行時の暴発防止）
notification_max_age_days = 3

[mail]
enabled = true
smtp_host = "smtp.gmail.com"
smtp_port = 587
smtp_user = "clinic-bot@example.com"
# password は環境変数 SMTP_PASSWORD で渡す（Gmail なら「アプリパスワード」）
from_addr = "clinic-bot@example.com"
to_addrs = ["doctor@example.com", "nurse@example.com"]
subject_template = "【要確認】{name}さん 大腸カメラ事前診察の予約なし"

[state]
# 処理済みの予約IDを記録するファイル。消すと全部やり直しになる
path = "state/processed.json"
